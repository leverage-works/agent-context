name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: make test release-check
      - name: Validate APM installation
        run: |
          uv tool install apm-cli==0.30.0
          apm install --target codex --dry-run
          make apm-install

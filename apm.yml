name: agent-context
version: 0.2.1
description: Codex-first APM packages for personal-leverage.
author: personal-leverage
license: UNLICENSED
targets:
  - codex
devDependencies:
  apm:
    - path: ./packages/org-meta-bundle
scripts:
  hydrate-cached-docs: uv run .agents/skills/use-cached-docs/scripts/hydrate_cached_docs.py

marketplace:
  owner:
    name: personal-leverage
    url: https://github.com/personal-leverage
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: lockstep
  packages:
    - name: org-meta-bundle
      source: personal-leverage/agent-context
      subdir: packages/org-meta-bundle
      version: 0.2.1
      category: Productivity
